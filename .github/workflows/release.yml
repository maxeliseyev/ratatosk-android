name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ratatosk-android
        uses: actions/checkout@v4
        with:
          path: ratatosk-android

      # The Rust crate path-depends on ../ratatosk/crates/core.
      - name: Checkout ratatosk core
        uses: actions/checkout@v4
        with:
          repository: maxeliseyev/ratatosk
          path: ratatosk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also asks for the legacy 'tools' package, which no
          # longer exists in the SDK repository.
          packages: platform-tools

      - name: Install platform, build-tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "build-tools;36.0.0"
          # The runner image ships an NDK; only install one if none is there.
          if ! ls "$ANDROID_HOME/ndk"/*/ >/dev/null 2>&1; then
            sdkmanager --install "ndk;27.2.12479018"
          fi
          ls "$ANDROID_HOME/ndk" || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ratatosk-android/rust -> target

      - name: Build the Rust core (.so for every ABI)
        working-directory: ratatosk-android
        env:
          RATATOSK_DIR: ${{ github.workspace }}/ratatosk
        run: scripts/update-core.sh

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RATATOSK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ratatosk-release.jks"
          else
            echo "::warning::RATATOSK_KEYSTORE_BASE64 is not set; the APK will be debug-signed"
          fi

      - name: Build the release APK
        working-directory: ratatosk-android
        env:
          RATATOSK_KEYSTORE_FILE: ${{ runner.temp }}/ratatosk-release.jks
          RATATOSK_KEYSTORE_PASSWORD: ${{ secrets.RATATOSK_KEYSTORE_PASSWORD }}
          RATATOSK_KEY_ALIAS: ${{ secrets.RATATOSK_KEY_ALIAS }}
          RATATOSK_KEY_PASSWORD: ${{ secrets.RATATOSK_KEY_PASSWORD }}
        run: |
          tag="${GITHUB_REF_NAME:-dev}"
          version="${tag#v}"
          version_code="${GITHUB_RUN_NUMBER:-1}"
          ./gradlew --no-daemon :app:assembleRelease \
            -PversionName="$version" \
            -PversionCode="$version_code"

      - name: Collect the APK
        id: apk
        working-directory: ratatosk-android
        run: |
          src="$(find app/build/outputs/apk/release -name 'app-release*.apk' | head -1)"
          [ -n "$src" ] || { echo "no release APK produced" >&2; exit 1; }
          out="$RUNNER_TEMP/ratatosk-${GITHUB_REF_NAME:-dev}.apk"
          cp "$src" "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # A build from a tag publishes a GitHub Release; a manual run only
      # leaves the APK as a workflow artifact.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: ratatosk-apk
          path: ${{ steps.apk.outputs.path }}
